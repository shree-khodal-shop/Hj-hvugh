<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 wave · music player</title>
    <!-- Font Awesome (free icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* card */
        .player-card {
            max-width: 480px;
            width: 100%;
            background: rgba(22, 28, 46, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3rem 3rem 2.5rem 2.5rem;
            padding: 2rem 1.8rem 2.2rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* header */
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #b9c8e6;
            margin-bottom: 1.8rem;
            padding: 0 0.2rem;
        }

        .player-header h2 {
            font-weight: 500;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #d6e2ff, #a0b9f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .player-header h2 i {
            color: #6d8cff;
            font-size: 1.1rem;
        }

        .header-actions i {
            font-size: 1.2rem;
            color: #7b8ec0;
            cursor: default;
            transition: 0.2s;
            margin-left: 0.6rem;
            opacity: 0.7;
        }

        /* cover art */
        .cover-wrapper {
            position: relative;
            border-radius: 2.2rem;
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: 0 20px 35px -5px #03050b, 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .cover-wrapper img {
            display: block;
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background: #1f263b;
            transition: transform 0.3s ease;
        }

        .cover-wrapper:hover img {
            transform: scale(1.01);
        }

        /* track info */
        .track-info {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .track-info h3 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #f0f3fc;
            letter-spacing: -0.3px;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-info p {
            font-size: 1rem;
            color: #95a9d9;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* progress bar */
        .progress-area {
            margin-bottom: 1.5rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #2a3150;
            border-radius: 20px;
            cursor: pointer;
            position: relative;
            transition: height 0.1s ease;
        }

        .progress-bar:hover {
            height: 8px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #7b9aff, #b6cbff);
            border-radius: 20px;
            position: relative;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px #6a8aff66;
        }

        .time-indicators {
            display: flex;
            justify-content: space-between;
            margin-top: 0.4rem;
            font-size: 0.8rem;
            color: #7d8fba;
            font-weight: 400;
            letter-spacing: 0.2px;
            padding: 0 2px;
        }

        /* controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            margin: 1.8rem 0 1.2rem;
        }

        .controls button {
            background: transparent;
            border: none;
            color: #d3defa;
            font-size: 1.5rem;
            width: 3.2rem;
            height: 3.2rem;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s ease;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .controls button i {
            filter: drop-shadow(0 2px 4px #00000033);
        }

        .controls button:hover {
            background: #2e365a;
            color: white;
            transform: scale(1.03);
            border-color: #4b5a8a;
        }

        .controls button:active {
            transform: scale(0.94);
        }

        .play-btn {
            background: linear-gradient(135deg, #4f6ef7, #7b9aff) !important;
            color: white !important;
            width: 4.2rem !important;
            height: 4.2rem !important;
            font-size: 2rem !important;
            border: none !important;
            box-shadow: 0 10px 20px -5px #1f2b70, 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #5f7cff, #8aacff) !important;
            transform: scale(1.05);
            box-shadow: 0 12px 28px -5px #2f3f96;
        }

        /* extra actions (like / shuffle) */
        .extra-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.6rem;
            padding: 0 0.2rem;
        }

        .extra-actions i {
            color: #6378af;
            font-size: 1.1rem;
            transition: 0.2s;
            cursor: default;
            opacity: 0.6;
        }

        .extra-actions i:hover {
            color: #b2c8ff;
            opacity: 1;
        }

        .extra-actions .right-icons i {
            margin-left: 0.9rem;
        }

        /* playlist (mini) */
        .playlist {
            margin-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 1.2rem;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 0.6rem 0.8rem;
            border-radius: 1.2rem;
            background: transparent;
            transition: 0.15s ease;
            cursor: default;
            margin-bottom: 0.2rem;
        }

        .playlist-item:hover {
            background: #262e4b;
        }

        .playlist-item.active {
            background: #2d3560;
            border-left: 3px solid #7b9aff;
        }

        .playlist-item .index {
            width: 2rem;
            color: #6d81b5;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .playlist-item .p-info {
            flex: 1;
        }

        .playlist-item .p-info .p-title {
            color: #e9efff;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .playlist-item .p-info .p-artist {
            color: #8497c9;
            font-size: 0.75rem;
        }

        .playlist-item .duration {
            color: #6579ab;
            font-size: 0.75rem;
            background: #1b223a;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
        }

        .playlist-item.active .p-title {
            color: white;
        }

        .playlist-item.active .duration {
            background: #3b4677;
            color: #d6e2ff;
        }

        /* responsive */
        @media (max-width: 480px) {
            .player-card {
                padding: 1.5rem 1.2rem;
                border-radius: 2.2rem;
            }
            .track-info h3 {
                font-size: 1.3rem;
            }
            .controls button {
                width: 2.8rem;
                height: 2.8rem;
                font-size: 1.2rem;
            }
            .play-btn {
                width: 3.6rem !important;
                height: 3.6rem !important;
                font-size: 1.6rem !important;
            }
        }
    </style>
</head>
<body>

<div class="player-card" id="app">
    <!-- header -->
    <div class="player-header">
        <h2><i class="fas fa-headphones-alt"></i> wave</h2>
        <div class="header-actions">
            <i class="fas fa-bolt"></i>
            <i class="fas fa-ellipsis-h"></i>
        </div>
    </div>

    <!-- cover -->
    <div class="cover-wrapper">
        <img id="coverArt" src="https://picsum.photos/seed/jazz/400/400" alt="album cover">
    </div>

    <!-- track info -->
    <div class="track-info">
        <h3 id="trackTitle">Nightfall</h3>
        <p id="trackArtist">Echo & the Veil</p>
    </div>

    <!-- progress -->
    <div class="progress-area">
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
        <div class="time-indicators">
            <span id="currentTime">0:00</span>
            <span id="totalTime">3:42</span>
        </div>
    </div>

    <!-- main controls -->
    <div class="controls">
        <button id="prevBtn"><i class="fas fa-backward"></i></button>
        <button class="play-btn" id="playBtn"><i class="fas fa-play" id="playIcon"></i></button>
        <button id="nextBtn"><i class="fas fa-forward"></i></button>
    </div>

    <!-- extra actions -->
    <div class="extra-actions">
        <i class="fas fa-heart"></i>
        <div class="right-icons">
            <i class="fas fa-random"></i>
            <i class="fas fa-repeat"></i>
        </div>
    </div>

    <!-- mini playlist -->
    <div class="playlist" id="playlistContainer">
        <!-- dynamic from JS -->
    </div>
</div>

<script>
    (function() {
        // ---------- data ----------
        const playlist = [
            { title: "Nightfall", artist: "Echo & the Veil", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", duration: "3:42" },
            { title: "Urban Drift", artist: "Lunar Pulse", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", duration: "4:01" },
            { title: "Silent Waves", artist: "Aurora Sky", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", duration: "3:28" },
            { title: "Neon Glow", artist: "Pixel Dream", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", duration: "3:55" }
        ];

        // DOM refs
        const coverImg = document.getElementById('coverArt');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const progressFill = document.getElementById('progressFill');
        const currentTimeSpan = document.getElementById('currentTime');
        const totalTimeSpan = document.getElementById('totalTime');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const playlistContainer = document.getElementById('playlistContainer');

        // Audio element
        const audio = new Audio();
        audio.preload = 'metadata';

        let currentTrackIndex = 0;
        let isPlaying = false;
        let isDragging = false;

        // ---------- helper: format time (seconds -> mm:ss) ----------
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // ---------- load track ----------
        function loadTrack(index) {
            const track = playlist[index];
            if (!track) return;
            audio.src = track.src;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            // cover image (use picsum with seed)
            coverImg.src = `https://picsum.photos/seed/${track.title.replace(/\s/g,'')}/400/400`;
            totalTimeSpan.textContent = track.duration || '3:00';
            // reset progress
            progressFill.style.width = '0%';
            currentTimeSpan.textContent = '0:00';
            // update active playlist item
            updatePlaylistActive(index);
            // if audio is loaded, update duration
            if (audio.readyState >= 2) {
                totalTimeSpan.textContent = formatTime(audio.duration);
            }
        }

        // ---------- play / pause ----------
        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(e => console.warn('play error', e));
                isPlaying = true;
                playIcon.className = 'fas fa-pause';
            } else {
                audio.pause();
                isPlaying = false;
                playIcon.className = 'fas fa-play';
            }
        }

        // ---------- next / prev ----------
        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                audio.play().catch(e => console.warn('autoplay error', e));
            } else {
                // if paused, still load but keep paused
                audio.pause();
            }
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                audio.play().catch(e => console.warn('autoplay error', e));
            } else {
                audio.pause();
            }
        }

        // ---------- update playlist active highlight ----------
        function updatePlaylistActive(index) {
            const items = playlistContainer.querySelectorAll('.playlist-item');
            items.forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }

        // ---------- render playlist UI ----------
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item' + (index === currentTrackIndex ? ' active' : '');
                item.innerHTML = `
                    <span class="index">${String(index + 1).padStart(2, '0')}</span>
                    <div class="p-info">
                        <div class="p-title">${track.title}</div>
                        <div class="p-artist">${track.artist}</div>
                    </div>
                    <span class="duration">${track.duration || '3:00'}</span>
                `;
                // click to play
                item.addEventListener('click', () => {
                    if (currentTrackIndex === index) {
                        // if same track, toggle play
                        togglePlay();
                    } else {
                        currentTrackIndex = index;
                        loadTrack(currentTrackIndex);
                        audio.play().catch(e => console.warn('play error', e));
                        isPlaying = true;
                        playIcon.className = 'fas fa-pause';
                    }
                });
                playlistContainer.appendChild(item);
            });
        }

        // ---------- update progress from timeupdate ----------
        function updateProgress() {
            if (isDragging) return;
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
                totalTimeSpan.textContent = formatTime(audio.duration);
            } else {
                // fallback
                if (audio.currentTime) {
                    currentTimeSpan.textContent = formatTime(audio.currentTime);
                }
            }
        }

        // ---------- progress bar drag (click & drag) ----------
        function handleProgressClick(e) {
            const rect = progressBar.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const percent = Math.min(1, Math.max(0, x));
            if (audio.duration) {
                audio.currentTime = percent * audio.duration;
                progressFill.style.width = `${percent * 100}%`;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
            }
        }

        function handleProgressDrag(e) {
            isDragging = true;
            const rect = progressBar.getBoundingClientRect();
            let x = (e.clientX - rect.left) / rect.width;
            x = Math.min(1, Math.max(0, x));
            progressFill.style.width = `${x * 100}%`;
            if (audio.duration) {
                const newTime = x * audio.duration;
                currentTimeSpan.textContent = formatTime(newTime);
            }
        }

        function handleProgressDragEnd(e) {
            isDragging = false;
            if (audio.duration) {
                const rect = progressBar.getBoundingClientRect();
                let x = (e.clientX - rect.left) / rect.width;
                x = Math.min(1, Math.max(0, x));
                audio.currentTime = x * audio.duration;
                progressFill.style.width = `${x * 100}%`;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
            }
        }

        // ---------- event listeners ----------
        // controls
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);

        // audio events
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', () => {
            // auto next
            nextTrack();
            // if still playing (we call nextTrack, and if isPlaying true it will autoplay)
            // but if isPlaying false, we keep paused
            if (isPlaying) {
                audio.play().catch(e => console.warn('autoplay after end error', e));
            }
        });

        // progress bar events
        progressBar.addEventListener('click', handleProgressClick);
        progressBar.addEventListener('mousedown', (e) => {
            isDragging = true;
            handleProgressDrag(e);
            document.addEventListener('mousemove', handleProgressDrag);
            document.addEventListener('mouseup', (upEvent) => {
                handleProgressDragEnd(upEvent);
                document.removeEventListener('mousemove', handleProgressDrag);
                document.removeEventListener('mouseup', this);
                isDragging = false;
            });
        });

        // optional: touch support for progress
        progressBar.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = progressBar.getBoundingClientRect();
            let x = (touch.clientX - rect.left) / rect.width;
            x = Math.min(1, Math.max(0, x));
            progressFill.style.width = `${x * 100}%`;
            if (audio.duration) {
                audio.currentTime = x * audio.duration;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
            }
        });

        // load initial track
        loadTrack(0);
        renderPlaylist();

        // set duration once metadata loaded
        audio.addEventListener('loadedmetadata', () => {
            totalTimeSpan.textContent = formatTime(audio.duration);
        });

        // handle audio error (fallback)
        audio.addEventListener('error', (e) => {
            console.warn('audio error', e);
        });

        // extra: keyboard shortcut (space) but optional
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // clean up (optional)
        window.addEventListener('beforeunload', () => {
            audio.pause();
            audio.src = '';
        });

        // fix for autoplay blocking: if user clicks on any playlist item, it's fine
        console.log('🎵 wave player ready');
    })();
</script>
</body>
</html>
